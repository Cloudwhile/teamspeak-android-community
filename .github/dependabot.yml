version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/rust-core"
    target-branch: "master"
    schedule:
      interval: "weekly"
