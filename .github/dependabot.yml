version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    open-pull-requests-limit: 3
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "master"
    open-pull-requests-limit: 3
    schedule:
      interval: "monthly"
    groups:
      android-patch-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Toolchain & SDK-coupled libraries require coordinated AGP + Kotlin + KSP + compileSdk upgrades
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "com.google.devtools.ksp*"
      - dependency-name: "com.android.application*"
      - dependency-name: "androidx.compose:compose-bom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/rust-core"
    target-branch: "master"
    open-pull-requests-limit: 3
    schedule:
      interval: "monthly"
    groups:
      rust-safe:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # jni 0.22+ introduces breaking lifetime/signature changes across JNI exports
      - dependency-name: "jni"
        versions: [">= 0.22.0"]
