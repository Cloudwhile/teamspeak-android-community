version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    open-pull-requests-limit: 3
    schedule:
      interval: "monthly"
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "master"
    open-pull-requests-limit: 3
    schedule:
      interval: "monthly"
  - package-ecosystem: "cargo"
    directory: "/rust-core"
    target-branch: "master"
    open-pull-requests-limit: 3
    schedule:
      interval: "monthly"
