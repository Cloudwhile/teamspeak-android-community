name: Bug Report
description: Report a crash, connection issue, or audio bug in TSCC / 报告崩溃、连接或音频异常
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Note that TSCC is an unofficial community project. Never include private server passwords or `.ini` identity private keys.
        感谢反馈问题！请勿在报告中附带服务器私密密码或个人 `.ini` 身份私钥。
  - type: input
    id: version
    attributes:
      label: TSCC Version & ABI / 版本与安装包架构
      placeholder: "e.g. v0.1.0-alpha.1 (arm64-v8a)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Android Version / 设备型号与系统版本
      placeholder: "e.g. Pixel 8 / Android 14"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce / 复现步骤
      placeholder: |
        1. Connect to server (TS3 3.13 / TS6)...
        2. Tap...
        3. Observed behavior...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior / 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / 相关日志 (filter Logcat by tscc_core / TSCC, redact secrets)
      render: shell
