name: Feature Request
description: Suggest an enhancement or new capability / 提出新功能或体验优化建议
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case / 使用场景与痛点
      placeholder: Describe the scenario you want to improve...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / 建议方案
      placeholder: Describe the desired behavior...
    validations:
      required: true
