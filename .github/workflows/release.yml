name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (e.g. v0.1.0-alpha.1)"
        required: true
        type: string
      prerelease:
        description: "Mark release as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  OPUS_STATIC: "1"
  LIBOPUS_STATIC: "1"
  OPUS_NO_PKG: "1"
  LIBOPUS_NO_PKG: "1"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build Signed Multi-ABI APKs & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate semantic version
        id: meta
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [[ ! "$RAW_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "Invalid semantic version tag: '$RAW_TAG' (expected vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          SUFFIX="${BASH_REMATCH[4]}"
          PRE_BODY="${BASH_REMATCH[5]}"
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}${SUFFIX}"

          BASE_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 ))
          if [[ -z "$PRE_BODY" ]]; then
            STAGE_OFFSET=99
          else
            PRE_LOWER=$(echo "$PRE_BODY" | tr '[:upper:]' '[:lower:]')
            PRE_NUM=$(echo "$PRE_LOWER" | grep -oE '[0-9]+' | head -n 1 || true)
            PRE_NUM=${PRE_NUM:-1}
            if [ "$PRE_NUM" -gt 29 ]; then PRE_NUM=29; fi
            if [ "$PRE_NUM" -lt 1 ]; then PRE_NUM=1; fi
            if [[ "$PRE_LOWER" == alpha* ]]; then
              STAGE_OFFSET=$PRE_NUM
            elif [[ "$PRE_LOWER" == beta* ]]; then
              STAGE_OFFSET=$(( 30 + PRE_NUM ))
            elif [[ "$PRE_LOWER" == rc* ]]; then
              STAGE_OFFSET=$(( 60 + PRE_NUM ))
            else
              STAGE_OFFSET=$PRE_NUM
            fi
          fi
          VERSION_CODE=$(( BASE_CODE + STAGE_OFFSET ))
          if [ "$VERSION_CODE" -le 0 ]; then
            VERSION_CODE=1
          fi

          IS_PRERELEASE="${{ github.event.inputs.prerelease || 'false' }}"
          if [[ -n "$SUFFIX" ]]; then
            IS_PRERELEASE="true"
          fi

          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config build-essential

      - name: Configure Android SDK, NDK, CMake & apksigner
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Install Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: release-ndk-28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Rust core test suite
        run: cargo test --manifest-path rust-core/Cargo.toml --locked

      - name: Prepare release signing keystore
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          KS_FILE="$RUNNER_TEMP/tscc-release-signing.jks"
          rm -f "$KS_FILE"
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KS_FILE"
            echo "keystore_file=$KS_FILE" >> "$GITHUB_OUTPUT"
            echo "store_password=$SIGNING_STORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_alias=$SIGNING_KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_password=$SIGNING_KEY_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "Using repository release signing keystore."
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; generating fallback PKCS12 keystore so all APKs are signed and installable."
            keytool -genkeypair \
              -v \
              -storetype PKCS12 \
              -keystore "$KS_FILE" \
              -alias "tscc" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android" \
              -keypass "android" \
              -dname "CN=TSCC Community, OU=Android, O=Cloudwhile, C=US"
            echo "keystore_file=$KS_FILE" >> "$GITHUB_OUTPUT"
            echo "store_password=android" >> "$GITHUB_OUTPUT"
            echo "key_alias=tscc" >> "$GITHUB_OUTPUT"
            echo "key_password=android" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & verify multi-architecture Release APKs
        env:
          SIGNING_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_file }}
          SIGNING_STORE_PASSWORD: ${{ steps.signing.outputs.store_password }}
          SIGNING_KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
          SIGNING_KEY_PASSWORD: ${{ steps.signing.outputs.key_password }}
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintVitalRelease \
            :app:assembleRelease \
            -PversionName="${{ steps.meta.outputs.version_name }}" \
            -PversionCode="${{ steps.meta.outputs.version_code }}" \
            --no-daemon \
            --stacktrace

      - name: Stage, verify signatures & checksum all architecture APKs
        run: |
          mkdir -p dist
          VERSION="${{ steps.meta.outputs.version_name }}"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            SRC_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*${abi}*-release.apk" | head -n 1)
            if [ -z "$SRC_APK" ] || [ ! -f "$SRC_APK" ]; then
              echo "Expected APK for ABI '$abi' not found!"
              exit 1
            fi
            DEST_APK="dist/TSCC-v${VERSION}-${abi}.apk"
            cp "$SRC_APK" "$DEST_APK"
            "$APKSIGNER" verify --verbose "$DEST_APK"
          done

          (
            cd dist
            sha256sum *.apk > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/tscc-release-signing.jks"

      - name: Generate release body header
        run: |
          VERSION="${{ steps.meta.outputs.version_name }}"
          {
            echo "> **Unofficial Notice / 非官方声明**: TSCC is an independent, unofficial open-source community client and is NOT affiliated with, authorized, or endorsed by TeamSpeak Systems GmbH. / TSCC 为社区独立维护的非官方开源客户端，与 TeamSpeak Systems GmbH 无任何隶属、授权或背书关系。"
            echo ""
            echo "### 📦 Multi-Architecture APK Downloads / 多架构安装包选择指南"
            echo ""
            echo "| Package / 文件名 | Architecture / 架构 | Target Devices / 适用设备 |"
            echo "| :--- | :--- | :--- |"
            echo "| \`TSCC-v${VERSION}-arm64-v8a.apk\` | \`arm64-v8a\` | **Recommended / 推荐**: Modern 64-bit ARM Android phones & tablets |"
            echo "| \`TSCC-v${VERSION}-armeabi-v7a.apk\` | \`armeabi-v7a\` | Legacy 32-bit ARM Android devices |"
            echo "| \`TSCC-v${VERSION}-x86_64.apk\` | \`x86_64\` | Android Emulator, Waydroid, ChromeOS |"
            echo "| \`TSCC-v${VERSION}-universal.apk\` | \`universal\` | Universal all-in-one APK |"
            echo ""
            echo "SHA-256 checksums are attached in \`SHA256SUMS.txt\`."
          } > dist/RELEASE_NOTES_HEADER.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "TSCC v${{ steps.meta.outputs.version_name }}"
          body_path: dist/RELEASE_NOTES_HEADER.md
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/TSCC-v${{ steps.meta.outputs.version_name }}-arm64-v8a.apk
            dist/TSCC-v${{ steps.meta.outputs.version_name }}-armeabi-v7a.apk
            dist/TSCC-v${{ steps.meta.outputs.version_name }}-x86_64.apk
            dist/TSCC-v${{ steps.meta.outputs.version_name }}-universal.apk
            dist/SHA256SUMS.txt
