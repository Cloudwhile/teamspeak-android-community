name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  OPUS_STATIC: "1"
  LIBOPUS_STATIC: "1"
  OPUS_NO_PKG: "1"
  LIBOPUS_NO_PKG: "1"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust Core Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust-core/Cargo.toml --locked

  android-build:
    name: Android Lint, Unit Tests & Multi-ABI Build
    runs-on: ubuntu-latest
    needs: rust-test
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Ninja build tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Set up Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK & NDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Rust cross-compile artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
          key: android-ndk-28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Execute unit tests, Release Lint & multi-ABI builds
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:lintVitalRelease :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Verify multi-architecture APKs exist
        run: |
          ls -lh app/build/outputs/apk/release/
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            count=$(find app/build/outputs/apk/release -maxdepth 1 -name "*${abi}*-release.apk" | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "Missing expected release APK for architecture: $abi"
              exit 1
            fi
          done

      - name: Upload multi-ABI Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: TSCC-ci-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
