[package]
name = "tscc-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "tscc_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
tsclientlib = { path = "vendor/tsclientlib", default-features = false, features = ["audio"] }
tsproto = { git = "https://github.com/ReSpeak/tsclientlib.git" }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib.git" }
tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib.git" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "io-util", "fs"] }
futures = "0.3"
jni = "0.21"
audiopus = "0.3.0-rc.0"
hickory-resolver = "0.26"
hickory-net = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
base64 = "0.23"
thiserror = "2"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
