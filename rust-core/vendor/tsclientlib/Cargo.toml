[package]
name = "tsclientlib"
version = "0.2.0"
edition = "2018"

[features]
default = ["audio"]
unstable = []
audio = ["audiopus"]
default-tls = ["reqwest/charset", "reqwest/default-tls", "reqwest/http2"]
audiopus-unstable = []

[dependencies]
audiopus = { version = "0.3.0-rc.0", optional = true }
base64 = "0.22"
futures = "0.3"
itertools = "0.14"
num-traits = "0.2"
pin-utils = "0.1"
rand = "0.10"
reqwest = { version = "0.13", default-features = false }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["time"] }
tokio-stream = "0.1"
tracing = "0.1"
hickory-net = "0.26"
hickory-resolver = "0.26"
ts-bookkeeping = { git = "https://github.com/ReSpeak/tsclientlib.git" }
tsproto = { git = "https://github.com/ReSpeak/tsclientlib.git" }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib.git" }
tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib.git" }
url = "2"
